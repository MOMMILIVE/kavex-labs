<!DOCTYPE html><html><head><title>Viewport Check</title></head>
<body style="font-family: monospace; font-size: 24px; padding: 40px; background: #111; color: #0f0;">
<h1>Viewport Debug Info</h1>
<p>Open this page on BOTH sites and compare the values.</p>
<pre id="info" style="font-size: 20px; line-height: 1.8;"></pre>
<script>
document.getElementById("info").textContent = JSON.stringify({
  "window.innerWidth": window.innerWidth,
  "window.innerHeight": window.innerHeight,
  "devicePixelRatio": window.devicePixelRatio,
  "screen.width": screen.width,
  "screen.height": screen.height,
  "clientWidth": document.documentElement.clientWidth,
  "zoom_level": Math.round(window.devicePixelRatio / (window.screen.width > 2000 ? 2 : 1) * 100) + "%",
  "raw_dpr": window.devicePixelRatio
}, null, 2);
</script>



<!-- KAVEX Floating WhatsApp Concierge -->
<style>
@property --gradient-angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

@property --gradient-angle-offset {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

@property --gradient-percent {
  syntax: "<percentage>";
  initial-value: 5%;
  inherits: false;
}

@property --gradient-shine {
  syntax: "<color>";
  initial-value: white;
  inherits: false;
}

.kavex-floating-concierge {
  --shiny-cta-bg: #000000;
  --shiny-cta-bg-subtle: #1a1818;
  --shiny-cta-fg: #ffffff;
  --shiny-cta-highlight: rgba(255, 255, 255, 0.7);
  --shiny-cta-highlight-subtle: #ffffff;
  --animation: gradient-angle linear infinite;
  --duration: 3s;
  --shadow-size: 2px;
  --transition: 800ms cubic-bezier(0.25, 1, 0.5, 1);
  
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 999999;
  isolation: isolate;
  overflow: hidden;
  cursor: pointer;
  outline-offset: 4px;
  padding: 0.85rem 1.45rem;
  font-family: "Geist", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 0.875rem;
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: 0.02em;
  border: 1px solid transparent;
  border-radius: 360px;
  color: var(--shiny-cta-fg);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(var(--shiny-cta-bg), var(--shiny-cta-bg)) padding-box,
    conic-gradient(
      from calc(var(--gradient-angle) - var(--gradient-angle-offset)),
      transparent,
      var(--shiny-cta-highlight) var(--gradient-percent),
      var(--gradient-shine) calc(var(--gradient-percent) * 2),
      var(--shiny-cta-highlight) calc(var(--gradient-percent) * 3),
      transparent calc(var(--gradient-percent) * 4)
    ) border-box;
  box-shadow: inset 0 0 0 1px var(--shiny-cta-bg-subtle), 0 8px 32px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
  transition: var(--transition);
  transition-property: --gradient-angle-offset, --gradient-percent, --gradient-shine, transform, box-shadow;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.kavex-floating-concierge::before,
.kavex-floating-concierge::after,
.kavex-floating-concierge .kavex-inner-glow::before {
  content: "";
  pointer-events: none;
  position: absolute;
  inset-inline-start: 50%;
  inset-block-start: 50%;
  translate: -50% -50%;
  z-index: -1;
}

.kavex-floating-concierge:active {
  transform: translateY(2px) scale(0.98);
}

/* Dots pattern */
.kavex-floating-concierge::before {
  --size: calc(100% - var(--shadow-size) * 3);
  --position: 2px;
  --space: calc(var(--position) * 2);
  width: var(--size);
  height: var(--size);
  background: radial-gradient(
    circle at var(--position) var(--position),
    white calc(var(--position) / 4),
    transparent 0
  ) padding-box;
  background-size: var(--space) var(--space);
  background-repeat: space;
  mask-image: conic-gradient(
    from calc(var(--gradient-angle) + 45deg),
    black,
    transparent 10% 90%,
    black
  );
  -webkit-mask-image: conic-gradient(
    from calc(var(--gradient-angle) + 45deg),
    black,
    transparent 10% 90%,
    black
  );
  border-radius: inherit;
  opacity: 0.35;
  z-index: -1;
}

/* Inner shimmer */
.kavex-floating-concierge::after {
  --animation: shimmer linear infinite;
  width: 100%;
  aspect-ratio: 1;
  background: linear-gradient(
    -50deg,
    transparent,
    var(--shiny-cta-highlight),
    transparent
  );
  mask-image: radial-gradient(circle at bottom, transparent 40%, black);
  -webkit-mask-image: radial-gradient(circle at bottom, transparent 40%, black);
  opacity: 0.45;
}

.kavex-floating-concierge .kavex-inner-glow {
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 1;
}

.kavex-floating-concierge .kavex-inner-glow::before {
  --size: calc(100% + 1rem);
  width: var(--size);
  height: var(--size);
  box-shadow: inset 0 -1ex 2rem 4px rgba(255, 255, 255, 0.25);
  opacity: 0;
  transition: opacity var(--transition);
  animation: calc(var(--duration) * 1.5) breathe linear infinite;
}

/* Animate */
.kavex-floating-concierge,
.kavex-floating-concierge::before,
.kavex-floating-concierge::after {
  animation: var(--animation) var(--duration),
    var(--animation) calc(var(--duration) / 0.4) reverse paused;
  animation-composition: add;
}

.kavex-floating-concierge:is(:hover, :focus-visible) {
  --gradient-percent: 20%;
  --gradient-angle-offset: 95deg;
  --gradient-shine: var(--shiny-cta-highlight-subtle);
  transform: translateY(-2px);
  box-shadow: inset 0 0 0 1px var(--shiny-cta-bg-subtle), 0 12px 40px rgba(0, 0, 0, 0.85), 0 0 25px rgba(255, 255, 255, 0.2);
}

.kavex-floating-concierge:is(:hover, :focus-visible),
.kavex-floating-concierge:is(:hover, :focus-visible)::before,
.kavex-floating-concierge:is(:hover, :focus-visible)::after {
  animation-play-state: running;
}

.kavex-floating-concierge:is(:hover, :focus-visible) .kavex-inner-glow::before {
  opacity: 1;
}

@keyframes gradient-angle {
  to {
    --gradient-angle: 360deg;
  }
}

@keyframes shimmer {
  to {
    rotate: 360deg;
  }
}

@keyframes breathe {
  from, to {
    scale: 1;
  }
  50% {
    scale: 1.2;
  }
}

@media (max-width: 640px) {
  .kavex-floating-concierge {
    bottom: 20px;
    right: 20px;
    padding: 0.72rem 1.15rem;
    font-size: 0.8125rem;
  }
}
</style>
